name: main

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Workspace is /home/runner/work/denvig/denvig so we want /home/runner/work as the root
  DENVIG_CODE_ROOT_DIR: ${{ github.workspace }}/../..

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install

      - run: pnpm run lint

      - run: pnpm run check-types

      - run: pnpm run test

      - run: pnpm run codegen

      - name: Verify codegen has not changed any files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Codegen has changed files. Please run 'pnpm run codegen' and commit the changes."
            git --no-pager diff
            exit 1
          fi

      - name: Install denvig-dev to PATH
        run: cp bin/denvig-dev /usr/local/bin/denvig

      - name: Check version
        run: denvig version

      - name: Verify config
        run: denvig config verify

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Compile binaries for all platforms
        run: denvig run compile
