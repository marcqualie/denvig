---
lockfileVersion: '9.0'

importers:

  .:
    configDependencies: {}
    packageManagerDependencies:
      pnpm:
        specifier: 12.3.4
        version: 12.3.4

packages:

  '@pnpm/exe.darwin-arm64@12.3.4':
    resolution: {integrity: sha512-test==}
    cpu: [arm64]
    os: [darwin]

  '@pnpm/exe.linux-x64@12.3.4':
    resolution: {integrity: sha512-test==}
    cpu: [x64]
    os: [linux]
    libc: [glibc]

  pnpm@12.3.4:
    resolution: {integrity: sha512-test==}
    engines: {node: '>=18.*'}
    hasBin: true

snapshots:

  '@pnpm/exe.darwin-arm64@12.3.4':
    optional: true

  '@pnpm/exe.linux-x64@12.3.4':
    optional: true

  pnpm@12.3.4:
    optionalDependencies:
      '@pnpm/exe.darwin-arm64': 12.3.4
      '@pnpm/exe.linux-x64': 12.3.4

---
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      yaml:
        specifier: ^2.9.0
        version: 2.9.0
      zod:
        specifier: ^4.6.1
        version: 4.6.1
    devDependencies:
      tsup:
        specifier: ^8.5.0
        version: 8.5.1(yaml@2.9.0)

packages:

  bundle-require@5.2.0:
    resolution: {integrity: sha512-test==}
    engines: {node: '>=18'}

  fsevents@2.3.3:
    resolution: {integrity: sha512-test==}
    engines: {node: ^8.16.0 || ^10.6.0 || >=11.0.0}
    os: [darwin]

  tsup@8.5.1:
    resolution: {integrity: sha512-test==}
    engines: {node: '>=18'}
    hasBin: true

  yaml@2.9.0:
    resolution: {integrity: sha512-test==}
    engines: {node: '>= 14.6'}
    hasBin: true

  zod@4.6.1:
    resolution: {integrity: sha512-test==}

snapshots:

  bundle-require@5.2.0: {}

  fsevents@2.3.3:
    optional: true

  tsup@8.5.1(yaml@2.9.0):
    dependencies:
      bundle-require: 5.2.0
      yaml: 2.9.0
    optionalDependencies:
      fsevents: 2.3.3

  yaml@2.9.0: {}

  zod@4.6.1: {}
